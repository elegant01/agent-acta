        if (j.added) { ElMessage.info('发现新 agent：' + j.added); loadAgents().then(loadSnapshot); }
        if (j.removed) { ElMessage.info('agent 已失效移除：' + j.removed); loadAgents().then(loadSnapshot); }
        // Trae 密钥写入/清除后，服务端广播 agents（含 hasKey 变化），页面需要刷新侧栏状态
        if ('traeKey' in j || 'traeKeyCleared' in j) { loadAgents(); return; }
        return;
      }
      // R9：异常命中集合变化（新日志扫完 / 规则被改 / 弹层保存）→ 更新侧栏徽章与「只看异常」集合
      if (j.type === 'alert') {
        appliedSeq = j.seq;
        applyAlertSummary(j.summary);
        applyAlertIds(j.ids);
        return;
      }
      if (j.type === 'update') { appliedSeq = j.seq; applyUpdate(j.entries, j.agents, j.projects); return; }
      if (j.type === 'resync') { appliedSeq = j.seq; loadSnapshot(); return; }
      if (j.type === 'remove') { appliedSeq = j.seq; applyRemove(j.ids || [], j.agents, j.projects); return; }
    }

    let es = null, retry = 0;
    function connect() {
      es = new EventSource('/api/events');
      es.onopen = () => { live.value = true; retry = 0; };
      es.onerror = () => { live.value = false; es.close(); setTimeout(connect, Math.min(15000, 1000 * ++retry)); };
      es.onmessage = ev => {
        try {
          const j = JSON.parse(ev.data);
          if (!j.type) return;
          if (snapPending && QUEUED_TYPE[j.type]) { snapQueue.push(j); return; }
          handleMsg(j);
        } catch {}
      };
    }

    // 先连 SSE 再拉快照（不是 .then 串行）：首扫分片期间页面必须尽早连上，
    // 否则服务端发的 scanning 进度事件没有人收 —— 那就白写了。
    connect();
    loadSnapshot();
    loadAgents();
    checkVersion();       // 与上面三条并行，不阻塞首屏
    refreshCtxUnfilled(); // 只为侧栏那个「待填 N」徽章，失败静默（打开弹层时会再拉一次并上报）
    // R6：首屏就带 #view=sess 打开时，视图在 restoreFromHash 里已经还原成 'sess' 了（那是第一份快照之前跑
    // 的 IIFE，那里只改状态、不发请求）。会话列表放在这一批启动请求之后拉：几个请求都是并行的、服务端
    // 统一 whenReady 等首扫就绪，谁先回来都不影响列表的正确性，但放在快照**之前**会让「还没就绪」的空
    // 结果先落地一次。
    if (view.value === 'sess') loadSessions();

    // R33：深链带了 #q=… 时，先把搜索态**立起来**再发请求。
    // 先立态的理由是排序：上面 loadSnapshot() 落地后会调 updateHash，而 updateHash 只在 searchOn 为真时
    // 才把 q 写回地址栏 —— 不先立态的话，它会先把深链带来的 q 抹掉、再被 runSearch 加回来，地址栏闪一下。
    // 请求本身不急：/api/search 服务端挂 whenReady，首扫没好之前它自己会在那边排队。
    if (pendingSearch) {
      searchQ.value = pendingSearch.q;
      searchRegex.value = pendingSearch.regex;
      searchNarrow.value = pendingSearch.narrow;
      searchOn.value = true;
      runSearch(pendingSearch.q);
    }

    // R11 导出增强：三件事 —— ① 多格式（JSON / CSV / Excel）；② CSV/Excel 带上导出时的筛选条件，
    // 能自证「按什么条件导出」（验收）③ 单条详情导出（含完整未截断内容）。不再硬截断 5000 条，
    // 全量导出当前筛选集（filtered），JSON/CSV/Excel 一致。序列化与下载在 shared.js（零依赖纯函数）。
    function exportFilename(ext) {
      // 用**本地时间**：文件名要和筛选区间（本地自然日）、卡面上的时间对得上；toISOString 落的是 UTC，
      // 东八区会出现「9 点导出的文件叫 01 点」。
      const d = new Date(), p = n => String(n).padStart(2, '0');
      return 'agent-acta-' + d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate())
        + p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds()) + '.' + ext;
    }
    // 「按什么条件导出」的完整说明：时间 / agent / 项目 / 状态 / 关键字 / 只看异常 / 条·页。
    // 服务于导出附注（表头、说明行与 JSON 的 meta）。字段名与筛选含义照实写，不自欺。
    function exportFilterText() {
      const parts = [];
      if (fDates.value) parts.push('时间: ' + fDates.value.join(' ~ '));
      else parts.push('时间: 全部');
      if (fAgent.value) parts.push('agent: ' + fAgent.value);
      else if (fAgents.value.length) parts.push('agent: ' + fAgents.value.join(', '));
      else parts.push('agent: 全部');
      const projLab = fProject.value ? fProject.value : (fProjects.value.length ? fProjects.value.join(', ') : '全部');
      parts.push('项目: ' + projLab);
      parts.push('状态: ' + (fStatus.value || '全部'));
      parts.push('关键字: ' + (fSearch.value || '（无）'));
      if (alertOnly.value) parts.push('只看异常: 是');
      parts.push('显示档位: ' + fLimit.value + ' 条/页');
      return parts;
    }
    // 单条导出行的公共字段（卡片条目上全都有）。CSV 列即这些标量值。
    const EXPORT_FIELDS = ['time', 'agent', 'project', 'session', 'status', 'preview', 'models', 'dur', 'tin', 'tout', 'tcache', 'total', 'calls', 'tools', 'nollm'];
    function exportRows() {
      return filtered.value.map(e => ({
        time: fmtTime(e.time), agent: e.agent == null ? '' : e.agent, project: e.project == null ? '' : e.project,
        session: e.session == null ? '' : e.session, status: e.status == null ? '' : e.status,
        preview: e.preview == null ? '' : e.preview, models: modelText(e.models),
        dur: e.dur == null ? '' : e.dur, tin: e.tin || 0, tout: e.tout || 0, tcache: e.tcache || 0, total: e.total || 0,
        calls: e.calls == null ? '' : e.calls, tools: e.tools == null ? '' : e.tools, nollm: e.nollm ? '是' : '',
      }));
    }
    function exportData(format) {
      const rows = exportRows();
      const note = exportFilterText();
      const f = String(format || 'json').toLowerCase();
      if (f === 'csv') {
        const lines = [['筛选条件: ' + note.join('；')], ['# 共 ' + rows.length + ' 条'],
          EXPORT_FIELDS];
        for (const r of rows) lines.push(EXPORT_FIELDS.map(k => r[k]));
        downloadBlob(new Blob([buildCSV(lines)], { type: 'text/csv;charset=utf-8' }), exportFilename('csv'));
      } else if (f === 'xls' || f === 'excel') {
        const header = EXPORT_FIELDS;
        const xls = buildExcelXLSText('agent-acta', note, header, rows);
        downloadBlob(new Blob([xls], { type: 'application/vnd.ms-excel;charset=utf-8' }), exportFilename('xls'));
      } else {
        const payload = { meta: { exportedAt: new Date().toISOString(), count: rows.length, filters: note }, entries: rows };
        downloadBlob(new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' }), exportFilename('json'));
      }
    }
    // 保持 exportJSON 名（历史事件仍叫 export-json），转发到 JSON 分支；缺省参数按 json。
    function exportJSON(format) { exportData(format || 'json'); }

    // R11 导出单条详情：拉取 /api/entry 的**完整**版（full=1，未截断），连同条目元信息一起导出为 JSON。
    // 详情里工具入参/返回/逐次输出都是完整内容（服务端 full=1 就是为此存在的）。异步拉取，失败给提示。
    async function exportEntryDetail(id) {
      const e = id == null ? null : all.value.find(x => String(x.id) === String(id));
      if (!e) { ElementPlus.ElMessage.warning('无法导出：找不到该条目'); return; }
      try {
        const d = await getJSON('/api/entry?id=' + encodeURIComponent(e.id) + '&full=1');
        const payload = {
          meta: {
            exportedAt: new Date().toISOString(),
            id: e.id, agent: e.agent, project: e.project, session: e.session,
            time: fmtTime(e.time), status: e.status, durationMs: e.dur, models: modelText(e.models),
            totalTokens: e.total || 0, note: '单条完整详情导出（full=1，内容未截断）',
          },
          entry: d,
        };
        downloadBlob(new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' }), exportFilename('entry-' + String(e.id).replace(/[^A-Za-z0-9_\-.]/g, '_').slice(0, 40) + '.json'));
      } catch (err) {
        ElementPlus.ElMessage.error('详情导出失败：' + (err && err.message ? err.message : String(err)));
      }
    }

    // I8 单轮「复现包」：一键导出 zip（零依赖手写，见 shared.js 的 makeZip），内含：
    //   repro-meta.json —— 条目元信息 + build 指纹（version/build/pageBuild/parserRev）+ 导出时的筛选条件
    //   repro-raw.jsonl —— 该轮在原始日志里的片段（按解析器同款开轮判定切出；不可提取的 kind 诚实说明）
    //   repro-parsed.json —— 该轮完整解析结果（full=1，含工具明细、逐次调用）
    //   README.txt    —— 这个包是什么、怎么用、原始片段怎么定位
    // 服务端没有筛选态，所以「当前筛选条件」由页面贡献（exportFilterText），原样嵌进 meta.filters。
    async function exportRepro(id) {
      const e = id == null ? null : all.value.find(x => String(x.id) === String(id));
      if (!e) { ElementPlus.ElMessage.warning('无法导出复现包：找不到该条目'); return; }
      try {
        const filters = exportFilterText();
        const url = '/api/repro?id=' + encodeURIComponent(e.id) + '&filters=' + encodeURIComponent(JSON.stringify(filters));
        const data = await getJSON(url);
        if (!data || !data.ok) throw new Error((data && data.error) || '服务端返回异常');
        const safeId = String(e.id).replace(/[^A-Za-z0-9_\-.]/g, '_').slice(0, 40);
        const rawName = 'repro-raw.jsonl';   // 里面就是磁盘上那几行原文（逐行 JSON），所以带 .jsonl
        const rawText = (data.raw && data.raw.lines)
          ? data.raw.lines.join('\n')
          : ('# 原始片段不可用：' + ((data.raw && data.raw.note) || '未知原因') +
            (data.raw && data.raw.file ? '\n# 原始路径：' + data.raw.file : ''));
        const readme =
          'AgentActa 单轮「复现包」\n' +
          '====================\n' +
          '这是某一轮 agent 请求日志的一键复现包，用于贴进聊天 / 提 bug 时带上完整上下文。\n\n' +
          '包含文件：\n' +
          '- repro-meta.json  条目元信息 + 服务/页面 build 指纹（version/build/pageBuild/parserRev）+ 导出时的筛选条件\n' +
          '- repro-raw.jsonl 该轮在原始日志文件里的原始片段（行号与磁盘一致，可直接拷出复现）\n' +
          '- repro-parsed.json 该轮完整解析结果（含工具明细、逐次调用，未截断）\n' +
          '- README.txt  本说明\n\n' +
          '筛选条件（导出那一刻的页面状态，自证「当时按什么条件看的」）：\n' +
          (filters && filters.length ? filters.map(f => '  - ' + f).join('\n') : '  （无）') + '\n\n' +
          '原始片段说明：' + ((data.raw && data.raw.note) || '') + '\n';
        const files = [
          { name: 'repro-meta.json', text: JSON.stringify(data.meta, null, 2) },
          { name: rawName, text: rawText },
          { name: 'repro-parsed.json', text: JSON.stringify(data.parsed, null, 2) },
          { name: 'README.txt', text: readme },
        ];
        downloadBlob(makeZip(files), exportFilename('repro-' + safeId + '.zip'));
        ElementPlus.ElMessage.success('复现包已导出（' + (rawText.startsWith('#') ? '原始片段不可用，' : '') + '含解析结果 + build 指纹 + 筛选条件）');
      } catch (err) {
        ElementPlus.ElMessage.error('复现包导出失败：' + (err && err.message ? err.message : String(err)));
      }
    }

    // ----- 用量统计（C2；R25 批 1 起模板与统计逻辑全在 page/dialog-stats.js）-----
    // 数据来自 /api/daily：服务端在同一套筛选集（agent / 项目 / 时间范围）上按自然日分桶，
    // 且**不受「条/页」窗口限制**——所以这里的合计常常比列表标题那句「共 N 条」大，那不是 bug，
    // 是「统计口径不跟着显示档位变」的刻意选择（按天聚合要是被 2000 条窗口截断，换个档位数字就变，没法信）。
    // 根只剩三样：开不开（statsVisible）、递什么（statsReq）、弹层里换 agent 走侧栏那条路（onStatsAgentChange）。
    // 统计图与列表用的是**同一份**条目，只是聚合维度不同：统计里没有「状态 / 搜索」这两个**客户端**筛选
    // （它们是「在当前窗口里挑」，不是「看某个东西的全部」），要按它们统计得先说清楚语义。
    const statsVisible = ref(false);
    const statsReq = ref(null);
    let statsReqN = 0;   // 只用来给 req 一个身份：开着弹层换 agent 时 visible 不变，组件靠 n 变化重算

    // 「统计的是哪一份数据」必须写清楚：用户刚在侧栏点过 agent / 项目，看到的数字得能对上他那一下点击。
    // 留在根是因为它读的是侧栏那份活状态（含项目分组名）——组件那边没有 projectGroups。
    function statsFilterText() {
      const parts = [fAgent.value ? 'agent = ' + fAgent.value
        : (fAgents.value.length ? 'agent ∈ ' + fAgents.value.join(', ') : '全部 agent')]; // R10：多选态如实写进统计口径
      if (fProject.value) {
        const g = projectGroups.value.find(x => x.key === fProject.value);
        parts.push('项目 = ' + (g ? g.label : fProject.value));
      } else parts.push('全部项目');
      return parts.join(' · ');
    }
    // 点击那一刻把「筛哪一份」拼成请求参数递给弹层（组件自己不认识侧栏状态）。
    // keepRange：弹层里换 agent 时保住手选的日期区间（同一段时间跨 agent 对比才有意义）。
    function openStats(keepRange) {
      const qs = new URLSearchParams();
      if (fDates.value) { qs.set('from', fDates.value[0]); qs.set('to', fDates.value[1]); }
      // R22：时间范围与列表同一区间（显式 from/to，customBounds 口径），统计跟随列表筛选，不再各自为政。
      // R10：多选态走 agents=/projects= 合集键（与单选互斥，同 snapUrl）
      if (fAgent.value) qs.set('agent', fAgent.value);
      else if (fAgents.value.length) qs.set('agents', fAgents.value.join(','));
      if (fProject.value) qs.set('project', fProject.value);
      else if (fProjects.value.length) qs.set('projects', fProjects.value.join(','));
      statsReq.value = { qs: qs.toString(), filterText: statsFilterText(), keepRange: !!keepRange, n: ++statsReqN };
      statsVisible.value = true;
    }
    // 弹层里的 agent 下拉与左侧栏是**同一个**筛选：改了它，背后的请求列表也跟着变，然后重算统计（保住日期区间）
    async function onStatsAgentChange(name) {
      await pickAgent(name || '');
      openStats(true);
    }

    // R27 活跃热力图：根只管开不开（侧栏项与弹层关闭按钮都要动它），数据与聚合全在组件里
    const heatmapVisible = ref(false);
    // R28 历史归档：同上（数据源是归档文件，连筛选都不跟随）
    const archiveVisible = ref(false);
    // R30 磁盘占用：同上（自己拉 /api/usage，走一遍磁盘的只读统计）
    const usageVisible = ref(false);
    // R32 解析器自检：同上（自己拉 /api/selftest，只读上一次回归跑的结果 —— 跑测试不在页面里）
    const selftestVisible = ref(false);
    // R9 异常巡检：visible 控制弹层开合；alertCount 是侧栏徽章数；alertHits 是「命中 id 集合」
    //（供「只看异常」筛选与弹层定位用，随 SSE alert 事件 / hello / 弹层保存回报而更新）。
    const alertVisible = ref(false);
    const alertCount = ref(0);
    const alertHits = ref(new Set());
    const alertOnly = ref(false);   // 「只看异常」开关：true 时 filtered 只留 alertHits 里的条目
    function applyAlertSummary(s) { if (s && typeof s.count === 'number') alertCount.value = s.count; }
    function applyAlertIds(ids) { alertHits.value = new Set(ids || []); }

    // ---- I9 两轮 diff ----
    // 卡片「对比」按钮的选中组：id 集合（最多 2 条）。选满两条自动弹开对比弹层，并清掉选中。
    // compareReq 与选中组分开持有：关掉弹层不清它，所以重选同一对时不会先闪一下空态。
    // ⚠ 弹层里**没有**「换条目」入口 —— 要换就得回列表重选两条（这条是设计边界，不是漏接线）。
    const compareSet = ref(new Set());
    const compareVisible = ref(false);
    const compareReq = ref(null);
    // 判一条在不在对比组里（作函数 prop 递给卡片，读的是根这份 Set）
    const compareIsOf = id => compareSet.value.has(id);
    function onCompare(e) {
      const id = e.id;
      const s = new Set(compareSet.value);
      if (s.has(id)) { s.delete(id); compareSet.value = s; return; }    // 取消选中
      if (s.size >= 2) { ElMessage.warning('一次只对比两条轮，先把已选的取消一条'); return; }
      s.add(id); compareSet.value = s;
      if (s.size === 2) {                                                   // 凑满两条 → 弹开 + 清选中
        const [aid, bid] = [...s];
        const src = searchOn.value ? searchHits.value : all.value;
        const a = src.find(x => x.id === aid), b = src.find(x => x.id === bid);
        // 选第一条与点第二条之间列表会换（SSE 增量、改筛选、切进搜索结果集）—— 那条可能就掉出去了。
        // 宁可留着刚点的这条让人重选，也不要把 {a:undefined,b:undefined} 递进弹层：
        // 那会弹出一个写着「还没有选够两条轮」的空层，看着像功能坏了。
        if (!a || !b) {
          compareSet.value = new Set([id]);
          ElMessage.warning('先选的那条已不在当前列表里，请重新选两条');
          return;
        }
        compareReq.value = { a, b };
        compareVisible.value = true;
        compareSet.value = new Set();
      }
    }

    return {
      all, booting, agents, versionMismatch, pageBuild: PAGE_BUILD_OK ? PAGE_BUILD : '', fAgent, fSearch, fProject, fDates, fStatus, fLimit, shown, STEP, showNoLLM, rangeTotal, failCount,
      renderMd, prettyJson, copyRaw, toolJsonFold, toggleJsonFold, callOpen, toggleCallOut, toolText, fullIds,
      sessVisible, sessReq, openSession, fmtDurBig,
      locateEntry,
      // R33 全文搜索：状态与两个动作交给 aa-log-view 渲染与转发（数据本身仍在根里，见头部契约）
      searchOn, searchQ, searchRegex, searchBusy, searchNarrow, searchError, searchMeta, searchCapped, searchHits,
      runSearch, clearSearch, toggleSearchNarrow,
      pickAgent, pickProject, pickRange, updateHash,
      statsVisible, statsReq, openStats, onStatsAgentChange, TrendCharts,
      heatmapVisible,
      archiveVisible,
      usageVisible,
      selftestVisible,
      alertVisible,
      alertCount,
      alertOnly,
      applyAlertSummary,
      alertHits,
      // I9 两轮 diff：选中组、弹层开关、递给弹层的两条、判选 + 收集回调
      compareVisible, compareReq, compareSet, compareIsOf, onCompare,
      expandedId, live, liveText, scanning, zhCn, filtered, visible, projectList, sideAgents,
      scanMs, scanOptions, paused, setScan,
      idleExitMs, idleOptions, idleText, setIdle,
      clientLaunching, launchClient,
      agentsMeta, addVisible, toggleLoading, capped,
      // Trae 解密按钮（模板里 v-if / @command / :disabled 直接用了这几个名字）：漏在这儿的话
      // _ctx.isTraeKeyAgent 是 undefined，v-if 一调用就抛 TypeError，整个 app.mount 失败 —— 表现是**整页白屏**，
      // 而且是渲染期崩的，顶栏的版本错配提示也不会出现，别往缓存/旧进程上查。
      isTraeKeyAgent, traeBusy, traeCommandUI, startTraeCapture, clearTraeKey,
      // Cursor token 采集 hook 按钮（同上：模板里 v-if / :class / @click 直接用了这几个名字，
      // 漏在这儿同样会整页白屏）
      isCursorHookAgent, cursorHookBusy, cursorHookState, toggleCursorHook,
      // R10 多选筛选：fAgents / pickAgentsMulti 是活的（661/663 行的 v-model 与 @change），
      // fProjects / pickProjectsMulti 目前只在注释掉的那段里（项目筛选 2026-09-17 起停用），一起导出是为了恢复时不用再想这件事。
      // 漏了不白屏，但多选一直不工作，统计弹窗里的 fAgents.length 还会抛同样的 TypeError。
      fAgents, fProjects, pickAgentsMulti, pickProjectsMulti,
      secs, toggleSec, collapseCard, cardMemo,
      fmtN, fmtDur, fmtTime, agentLetter, ctxUsed, ctxPct, detailOf, titleOf, modelText, toolList,
      isQoder, fmtCredits, fmtPct,
      agentColor, agentIcon, iconOf, pathTip, isDisabled, isMissing, isIconOnly, isLive,
      loadSnapshot, refresh, toggle, loadFull, reloadDetail, openAdd, onAgentAdded, removeAgentUI, toggleAgentUI, exportJSON, exportData, exportEntryDetail, exportRepro,
      diagVisible,
      ctxwVisible, refreshCtxUnfilled, ctxUnfilled,
      // R6 会话视图（view='sess'）：状态、派生量、以及那几个动作都要在这里露出去
      view, switchView, loadSessions, sessList, sessListLoading, sessListCapped, sessListError,
      sessSearch, sessSort, sessListFiltered, sessPick, pickSession, openSessionByKey, sessCur, sessCurLoading,
      sessOpen, sessToggleTurn, sessDetail, sessFullIds, sessLoadFull, sessHi, sessEventClick,
      sessCursor, sessSpan, sessFrom, sessTo, sessHasEvents, sessOvTurns, sessOvEvents, sessEvIndex, sessEvRows, sessOvClick,
      sessChart, sessChartOpen, sessChartGo, sessCollapseTurn,
      fmtAgo, sumTok,
      Search, Refresh, Download, QuestionFilled, Warning, DataLine,
    };
  },
});

app.use(ElementPlus);
if (ElementPlusIconsVue) {
  for (const [k, c] of Object.entries(ElementPlusIconsVue)) app.component(k, c);
}
// R25 批 1/2/3：组件注册一律在这儿做（方案 C 拍板）—— 根 script 最后执行，时序天然安全，
// 组件之间互相引用（组件模板里再写组件标签）不需要各自的 components: 声明，也就没有
// 「文件加载顺序错 → 引用到 undefined → prod 静默空白」这个坑。名字必须与组件文件的 name 一致
// （test/page-components-test.mjs 两头对）。
app.component('aa-dialog-diag', AACTA.DialogDiag);
app.component('aa-dialog-add-agent', AACTA.DialogAddAgent);
app.component('aa-dialog-ctxw', AACTA.DialogCtxw);
app.component('aa-dialog-sess-timeline', AACTA.DialogSessTimeline);
app.component('aa-dialog-stats', AACTA.DialogStats);
app.component('aa-dialog-heatmap', AACTA.DialogHeatmap);
app.component('aa-dialog-archive', AACTA.DialogArchive);
app.component('aa-dialog-usage', AACTA.DialogUsage);
app.component('aa-dialog-selftest', AACTA.DialogSelftest);
app.component('aa-dialog-alert', AACTA.DialogAlert);
app.component('aa-dialog-compare', AACTA.DialogCompare);
app.component('aa-topbar', AACTA.Topbar);
app.component('aa-sidebar', AACTA.Sidebar);
app.component('aa-sess-view', AACTA.SessView);
// 批 4：卡片先登记（aa-log-view 的模板里用它）—— 注册都在 app.mount 之前，解析时机安全
app.component('aa-log-card', AACTA.LogCard);
app.component('aa-log-view', AACTA.LogView);
app.mount('#app');
</script>
